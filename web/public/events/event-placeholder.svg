<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Event poster placeholder</title>
  <desc id="desc">Placeholder image reserved for future event posters.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <g fill="none" stroke="#64748b" stroke-width="6" opacity="0.55">
    <rect x="110" y="95" width="980" height="485" rx="30" />
    <line x1="110" y1="500" x2="1090" y2="500" />
  </g>
  <g fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="310" font-size="64" font-weight="700">Poster Coming Soon</text>
    <text x="600" y="365" font-size="30" opacity="0.8">Space reserved for event artwork</text>
  </g>
